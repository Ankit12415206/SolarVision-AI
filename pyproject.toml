[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solarvision-ai"
version = "1.0.0"
description = "Automated Multi-Task Solar Panel Defect Inspection from Drone and Electroluminescence Imagery"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "SolarVision AI Team" }]
keywords = [
    "solar panel",
    "photovoltaic",
    "defect detection",
    "computer vision",
    "deep learning",
    "drone imagery",
    "electroluminescence",
    "PyTorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "scikit-learn>=1.3.0",
    "scikit-image>=0.21.0",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "reportlab>=4.0.0",
    "SQLAlchemy>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.9.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]

# ── Black ────────────────────────────────────────────────────
[tool.black]
line-length = 88
target-version = ["py311", "py312"]
include = '\.pyi?$'
exclude = '(\.git|\.venv|build|dist|checkpoints|data)'

# ── isort ─────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 88
skip_glob = [".venv/*", "data/*", "checkpoints/*"]

# ── pytest ────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing"

# ── mypy ─────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
exclude = [".venv", "data", "checkpoints", "build"]
