# SolarVision AI — Default Training Configuration
# All hyperparameters go here. Never hardcode in Python scripts.

project:
  name: "SolarVision AI"
  version: "0.1.0"
  seed: 42
  device: "cpu"  # Set to "cuda" if GPU becomes available

paths:
  data_root: "data"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  augmented_dir: "data/augmented"
  checkpoints_dir: "checkpoints"
  logs_dir: "logs"
  reports_dir: "reports"

dataset:
  classes:
    - "clean"
    - "dust"
    - "microcrack"
  num_classes: 3
  image_size: 224  # pixels (H and W)
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  stratified: true

dataloader:
  batch_size: 16  # Reduce to 8 if CPU memory is tight
  num_workers: 0  # 0 for Windows compatibility; increase on Linux
  pin_memory: false  # Only useful with CUDA
  shuffle_train: true

augmentation:
  enabled: true
  horizontal_flip: true
  vertical_flip: false
  rotation_degrees: 15
  brightness_jitter: 0.2
  contrast_jitter: 0.2
  saturation_jitter: 0.1
  gaussian_noise: false

normalization:
  mean: [0.485, 0.456, 0.406]  # ImageNet defaults
  std: [0.229, 0.224, 0.225]

# ── Classification ─────────────────────────────────────────
classification:
  model_name: "custom_cnn"  # "custom_cnn" | "mobilenet_v2"
  num_classes: 6
  classes:
    - "Bird-drop"
    - "Clean"
    - "Dusty"
    - "Electrical-damage"
    - "Physical-Damage"
    - "Snow-Covered"
  image_size: 224
  pretrained: true
  freeze_backbone: false
  unfreeze_blocks: 0
  dropout: 0.3
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 30
  patience: 7  # Early stopping patience
  scheduler: "cosine"  # "cosine" | "reduce_on_plateau" | "step"

# ── Detection ───────────────────────────────────────────────
detection:
  architecture: "yolov8n"  # Lightweight anchor-free detector
  num_classes: 2
  classes:
    - "Dust"
    - "bird-droppings"
  image_size: 640
  confidence_threshold: 0.25
  iou_threshold: 0.45
  learning_rate: 0.01
  epochs: 50

# ── Segmentation ────────────────────────────────────────────
segmentation:
  architecture: "unet"
  in_channels: 1
  out_channels: 1
  base_channels: 16
  image_size: 256
  learning_rate: 0.001
  epochs: 40
  loss: "bce_dice"  # BCEWithLogits + Soft Dice
  pos_weight: 15.0  # Moderated from extreme 1939.69 for numerical stability

# ── Database ────────────────────────────────────────────────
database:
  path: "data/inspections.db"

# ── Logging ─────────────────────────────────────────────────
logging:
  level: "INFO"  # DEBUG | INFO | WARNING | ERROR
  log_file: "logs/solarvision.log"
  rotation: "10 MB"
  retention: "30 days"
